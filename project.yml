name: Blink
settings:
  base:
    MARKETING_VERSION: "0.8.3"
    CURRENT_PROJECT_VERSION: 12
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
    CEF_DIST_DIR: "$(PROJECT_DIR)/ThirdParty/CEF/cef_binary_144.0.6+g5f7e671+chromium-144.0.7559.59_macosarm64"
    CEF_INCLUDE_DIR: "$(CEF_DIST_DIR)/include"
targets:
  Blink:
    type: application
    platform: macOS
    sources:
      - path: Blink
        excludes:
          - Resources/Themes
      - path: Blink/Resources/Themes
        type: folder
        buildPhase: resources
    resources:
      - path: Blink/Resources/Wallpapers
        buildPhase: resources
    dependencies:
      - target: BlinkCEFWrapper
      - target: BlinkHelper
        link: false
        embed: false
      - framework: Frameworks/GhosttyKit.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: CoreVideo.framework
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - sdk: Carbon.framework
      - sdk: GameController.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blink.app
        INFOPLIST_KEY_CFBundleDisplayName: Blink
        INFOPLIST_KEY_NSPrincipalClass: BlinkChromiumApplication
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Blink uses Bluetooth only when embedded Chromium requests nearby device access from a website."
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_NAME: Blink
        CEF_HELPER_NAME: "Blink Helper"
        SWIFT_OBJC_BRIDGING_HEADER: Blink/Browser/Chromium/BlinkChromium-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(CEF_DIST_DIR)"
        OTHER_LDFLAGS:
          - "-lstdc++"
    postBuildScripts:
      - name: Stage CEF Framework
        script: |
          set -euo pipefail
          SRC="${CEF_DIST_DIR}/${CONFIGURATION}/Chromium Embedded Framework.framework"
          DST="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Frameworks/Chromium Embedded Framework.framework"
          SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:-${CODE_SIGN_IDENTITY:--}}"

          sign_bundle() {
            /usr/bin/codesign --force --deep --sign "${SIGN_IDENTITY}" --timestamp=none --generate-entitlement-der "$1"
          }

          rm -rf "${DST}"
          ditto "${SRC}" "${DST}"
          if [ ! -d "${DST}/Versions" ]; then
            mkdir -p "${DST}/Versions/A"
            mv "${DST}/Chromium Embedded Framework" "${DST}/Versions/A/Chromium Embedded Framework"
            mv "${DST}/Resources" "${DST}/Versions/A/Resources"
            mv "${DST}/Libraries" "${DST}/Versions/A/Libraries"
            ln -sfn A "${DST}/Versions/Current"
            ln -sfn "Versions/Current/Chromium Embedded Framework" "${DST}/Chromium Embedded Framework"
            ln -sfn "Versions/Current/Resources" "${DST}/Resources"
            ln -sfn "Versions/Current/Libraries" "${DST}/Libraries"
          fi
          sign_bundle "${DST}"
      - name: Stage CEF Helper
        script: |
          set -euo pipefail
          SRC="${BUILT_PRODUCTS_DIR}/${CEF_HELPER_NAME}.app"
          FRAMEWORKS_DIR="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Frameworks"
          DST="${FRAMEWORKS_DIR}/${CEF_HELPER_NAME}.app"
          BASE_HELPER_BUNDLE_ID="${PRODUCT_BUNDLE_IDENTIFIER}.helper"
          SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:-${CODE_SIGN_IDENTITY:--}}"

          sign_bundle() {
            /usr/bin/codesign --force --deep --sign "${SIGN_IDENTITY}" --timestamp=none --generate-entitlement-der "$1"
          }

          rm -rf "${DST}"
          mkdir -p "${FRAMEWORKS_DIR}"
          ditto "${SRC}" "${DST}"

          create_helper_variant() {
            local label="$1"
            local bundle_suffix="$2"
            local variant_name="${CEF_HELPER_NAME} (${label})"
            local variant_app="${FRAMEWORKS_DIR}/${variant_name}.app"
            local plist="${variant_app}/Contents/Info.plist"

            rm -rf "${variant_app}"
            ditto "${SRC}" "${variant_app}"
            mv "${variant_app}/Contents/MacOS/${CEF_HELPER_NAME}" \
               "${variant_app}/Contents/MacOS/${variant_name}"

            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ${variant_name}" "${plist}"
            /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable ${variant_name}" "${plist}"
            /usr/libexec/PlistBuddy -c "Set :CFBundleName ${variant_name}" "${plist}"
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${BASE_HELPER_BUNDLE_ID}${bundle_suffix}" "${plist}"
            sign_bundle "${variant_app}"
          }

          sign_bundle "${DST}"
          create_helper_variant "Alerts" ".alerts"
          create_helper_variant "GPU" ".gpu"
          create_helper_variant "Plugin" ".plugin"
          create_helper_variant "Renderer" ".renderer"
  BlinkDev:
    type: application
    platform: macOS
    sources:
      - path: Blink
        excludes:
          - Resources/Themes
      - path: Blink/Resources/Themes
        type: folder
        buildPhase: resources
    resources:
      - path: Blink/Resources/Wallpapers
        buildPhase: resources
    dependencies:
      - target: BlinkCEFWrapper
      - target: BlinkDevHelper
        link: false
        embed: false
      - framework: Frameworks/GhosttyKit.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: CoreVideo.framework
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - sdk: Carbon.framework
      - sdk: GameController.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blink.app.dev
        INFOPLIST_KEY_CFBundleDisplayName: "Blink Dev"
        INFOPLIST_KEY_NSPrincipalClass: BlinkChromiumApplication
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Blink uses Bluetooth only when embedded Chromium requests nearby device access from a website."
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_NAME: "Blink Dev"
        CEF_HELPER_NAME: "Blink Dev Helper"
        SWIFT_OBJC_BRIDGING_HEADER: Blink/Browser/Chromium/BlinkChromium-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(CEF_DIST_DIR)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Debug
        OTHER_LDFLAGS:
          - "-lstdc++"
    postBuildScripts:
      - name: Stage CEF Framework
        script: |
          set -euo pipefail
          SRC="${CEF_DIST_DIR}/${CONFIGURATION}/Chromium Embedded Framework.framework"
          DST="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Frameworks/Chromium Embedded Framework.framework"
          SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:-${CODE_SIGN_IDENTITY:--}}"

          sign_bundle() {
            /usr/bin/codesign --force --deep --sign "${SIGN_IDENTITY}" --timestamp=none --generate-entitlement-der "$1"
          }

          rm -rf "${DST}"
          ditto "${SRC}" "${DST}"
          if [ ! -d "${DST}/Versions" ]; then
            mkdir -p "${DST}/Versions/A"
            mv "${DST}/Chromium Embedded Framework" "${DST}/Versions/A/Chromium Embedded Framework"
            mv "${DST}/Resources" "${DST}/Versions/A/Resources"
            mv "${DST}/Libraries" "${DST}/Versions/A/Libraries"
            ln -sfn A "${DST}/Versions/Current"
            ln -sfn "Versions/Current/Chromium Embedded Framework" "${DST}/Chromium Embedded Framework"
            ln -sfn "Versions/Current/Resources" "${DST}/Resources"
            ln -sfn "Versions/Current/Libraries" "${DST}/Libraries"
          fi
          sign_bundle "${DST}"
      - name: Stage CEF Helper
        script: |
          set -euo pipefail
          SRC="${BUILT_PRODUCTS_DIR}/${CEF_HELPER_NAME}.app"
          FRAMEWORKS_DIR="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Frameworks"
          DST="${FRAMEWORKS_DIR}/${CEF_HELPER_NAME}.app"
          BASE_HELPER_BUNDLE_ID="${PRODUCT_BUNDLE_IDENTIFIER}.helper"
          SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:-${CODE_SIGN_IDENTITY:--}}"

          sign_bundle() {
            /usr/bin/codesign --force --deep --sign "${SIGN_IDENTITY}" --timestamp=none --generate-entitlement-der "$1"
          }

          rm -rf "${DST}"
          mkdir -p "${FRAMEWORKS_DIR}"
          ditto "${SRC}" "${DST}"

          create_helper_variant() {
            local label="$1"
            local bundle_suffix="$2"
            local variant_name="${CEF_HELPER_NAME} (${label})"
            local variant_app="${FRAMEWORKS_DIR}/${variant_name}.app"
            local plist="${variant_app}/Contents/Info.plist"

            rm -rf "${variant_app}"
            ditto "${SRC}" "${variant_app}"
            mv "${variant_app}/Contents/MacOS/${CEF_HELPER_NAME}" \
               "${variant_app}/Contents/MacOS/${variant_name}"

            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ${variant_name}" "${plist}"
            /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable ${variant_name}" "${plist}"
            /usr/libexec/PlistBuddy -c "Set :CFBundleName ${variant_name}" "${plist}"
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${BASE_HELPER_BUNDLE_ID}${bundle_suffix}" "${plist}"
            sign_bundle "${variant_app}"
          }

          sign_bundle "${DST}"
          create_helper_variant "Alerts" ".alerts"
          create_helper_variant "GPU" ".gpu"
          create_helper_variant "Plugin" ".plugin"
          create_helper_variant "Renderer" ".renderer"
  BlinkCEFWrapper:
    type: library.static
    platform: macOS
    sources:
      - path: ThirdParty/CEF/cef_binary_144.0.6+g5f7e671+chromium-144.0.7559.59_macosarm64/libcef_dll
        excludes:
          - ctocpp/test
          - cpptoc/test
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blink.app.cefwrapper
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - WRAPPING_CEF_SHARED=1
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(CEF_DIST_DIR)"
          - "$(CEF_INCLUDE_DIR)"
  BlinkHelper:
    type: application
    platform: macOS
    sources:
      - path: Support/ChromiumHelper/BlinkChromiumHelperMain.cc
    dependencies:
      - target: BlinkCEFWrapper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blink.app.helper
        PRODUCT_NAME: "Blink Helper"
        INFOPLIST_FILE: Support/ChromiumHelper/BlinkChromiumHelper-Info.plist
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
        GENERATE_INFOPLIST_FILE: false
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(CEF_DIST_DIR)"
          - "$(CEF_INCLUDE_DIR)"
  BlinkDevHelper:
    type: application
    platform: macOS
    sources:
      - path: Support/ChromiumHelper/BlinkChromiumHelperMain.cc
    dependencies:
      - target: BlinkCEFWrapper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blink.app.dev.helper
        PRODUCT_NAME: "Blink Dev Helper"
        INFOPLIST_FILE: Support/ChromiumHelper/BlinkChromiumHelper-Info.plist
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
        GENERATE_INFOPLIST_FILE: false
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(CEF_DIST_DIR)"
          - "$(CEF_INCLUDE_DIR)"
  BTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - BTests
    dependencies:
      - target: Blink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blink.app.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Blink.app/Contents/MacOS/Blink"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Blink:
    build:
      targets:
        Blink: all
        BTests: [test]
    test:
      targets:
        - BTests
  Blink Dev:
    build:
      targets:
        BlinkDev: all
        BTests: [test]
    test:
      targets:
        - BTests
